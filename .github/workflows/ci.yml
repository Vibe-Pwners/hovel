name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repository policy and build hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-slices-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-slices-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - run: python3 repo-tools/tasks/checkout.py status
      - run: aspect hovel-check repo
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py repo-quality

  core:
    name: Core fmt, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('core/MODULE.bazel.lock', 'core/.bazelversion') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - run: python3 repo-tools/tasks/checkout.py status
      - run: aspect hovel-check core
      - run: aspect hovel-release hovel
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-bazel-testlogs
          path: core/bazel-testlogs/
          if-no-files-found: ignore
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py ci-build-test

  sdk:
    name: SDK build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-slices-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-slices-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - run: aspect hovel-check sdk
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py sdk-ci

  modules:
    name: Modules build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-slices-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-slices-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - run: aspect hovel-check modules
      - run: aspect hovel-release modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-packages
          path: dist/modules/
          if-no-files-found: error
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py modules-ci

  docs:
    name: Docs, test report, and Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-slices-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-slices-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - name: Build evidence-backed Pages site
        run: aspect hovel-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py docs-ci

  squatter-wine:
    name: Squatter Wine tests and demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repository
          key: bazel-slices-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-slices-${{ runner.os }}-
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      - name: Configure Bazel cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: python3 repo-tools/tasks/configure_bazel_cache.py
      - name: Install demo host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --install-recommends wine32 wine64
      - run: aspect test --bazel-flag=--platforms=//platforms:windows_x86 --bazel-flag=--extra_toolchains=@mingw_i686//:toolchain --bazel-flag=--run_under=//tools/wine:wine_run //:modules_wine_test && aspect test --bazel-flag=--platforms=//platforms:windows_x64 --bazel-flag=--extra_toolchains=@mingw_x86_64//:toolchain --bazel-flag=--run_under=//tools/wine:wine_run //:modules_wine_test
      - run: aspect run //modules/docker/squatter-wine:functional_test -- --evidence-log=.test-report/jobs/squatter-wine-e2e.log --job-summary=.test-report/jobs/squatter-wine-e2e.json
      - run: aspect run //docs/tools/demo:materialize_squatter_wine_demo_outputs
      - if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 core/tools/ci/job_summary.py squatter-wine
