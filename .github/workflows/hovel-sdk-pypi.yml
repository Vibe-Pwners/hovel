name: Publish hovel-sdk to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/build-python-package
        with:
          package: hovel-sdk
          requested-version: ${{ github.event_name == 'release' && github.ref_name || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hovel-sdk-dist
          path: dist/*
          if-no-files-found: error
      - if: always()
        env: {JOB_STATUS: "${{ job.status }}"}
        run: python3 core/tools/ci/job_summary.py publish-sdk-build

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: hovel-sdk-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
