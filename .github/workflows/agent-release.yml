name: Agent integration release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
      - uses: ./.github/actions/setup-hovel
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::release tag $RELEASE_TAG does not match committed VERSION $version"
            exit 1
          fi
      - run: aspect hovel-check agent
      - run: aspect hovel-release agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hovel-agent-integrations
          path: dist/agent/
          if-no-files-found: error
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
          files: dist/agent/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
