# Lefthook drives the same Aspect commands developers and CI use.
#
# Install (or refresh) the hooks with: aspect hovel-hooks
#
# Skip a hook for one command with LEFTHOOK=0, e.g. LEFTHOOK=0 git commit ...

pre-commit:
  jobs:
    - name: precommit
      run: aspect hovel-check repo && aspect hovel-check core

pre-push:
  jobs:
    - name: prepush
      run: aspect hovel-check
