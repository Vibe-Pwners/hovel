min_version: "2.0.0"

pre-commit:
  jobs:
    - name: format-staged
      run: aspect run //modules/picblobs/tools:format_write -- {staged_files}
      stage_fixed: true
    - name: lint-staged
      run: aspect run //modules/picblobs/tools:lint_run -- {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: format-check
      run: aspect test --bazel-flag=--config=picblobs_quality //modules/picblobs/tools:format_check
    - name: lint-check
      run: aspect test --bazel-flag=--config=picblobs_quality //modules/picblobs/tools:lint_check
    - name: c-lint-check
      run: aspect build --bazel-flag=--config=picblobs_lint //modules/picblobs/src/... //modules/picblobs/tests/...
